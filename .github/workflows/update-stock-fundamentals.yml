name: Update Authorized Stocks

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market-data dependencies
        run: python -m pip install yfinance cryptography pandas

      - name: Verify stock password secret
        env:
          STOCK_ACCESS_PASSWORD: ${{ secrets.STOCK_ACCESS_PASSWORD }}
        run: |
          if [ -z "$STOCK_ACCESS_PASSWORD" ]; then
            echo "::error::Missing repository secret STOCK_ACCESS_PASSWORD"
            exit 1
          fi

      - name: Update encrypted Yahoo stock data
        env:
          PYTHONUNBUFFERED: "1"
          STOCK_ACCESS_PASSWORD: ${{ secrets.STOCK_ACCESS_PASSWORD }}
        run: python -u update_authorized_stocks.py

      - name: Commit encrypted stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authorized-stocks.enc.json
          if git diff --cached --quiet; then
            echo "No stock-data changes to commit."
          else
            git commit -m "Update authorized Yahoo stock data"
            git pull --rebase origin main
            git push origin main
          fi
