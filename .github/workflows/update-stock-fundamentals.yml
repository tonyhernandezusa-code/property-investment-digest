name: Update Stock Fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Update SEC stock fundamentals
        env:
          SEC_USER_AGENT: "PropertyInvestmentDigest/1.0 https://tonyhernandezusa-code.github.io/property-investment-digest/"
        run: python update_stock_fundamentals.py

      - name: Commit updated stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-fundamentals.json
          if git diff --cached --quiet; then
            echo "No stock-data changes to commit."
          else
            git commit -m "Update SEC stock fundamentals"
            git push
          fi
